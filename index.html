<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Marco & Martina</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Arial, sans-serif;
      background:#050505;
      color:white;
      overflow-x:hidden;
    }

    .collage{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:-3;
      background:#050505;
    }

    .collage-photo{
      position:absolute;
      background-size:cover;
      background-position:center;
      border-radius:26px;
      opacity:0;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      animation:photoAppear 1.8s ease forwards;
      border:2px solid rgba(255,255,255,.06);
    }

    .collage-photo::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:26px;
      background:rgba(0,0,0,.02);
    }

    .photo1{
      background-image:url('images/foto1.jpg');
      width:24vw;
      height:32vh;
      top:4%;
      left:4%;
      transform:rotate(-5deg);
      animation-delay:.2s;
    }

    .photo2{
      background-image:url('images/foto2.jpg');
      width:22vw;
      height:30vh;
      top:6%;
      left:38%;
      transform:rotate(4deg);
      animation-delay:1s;
    }

    .photo3{
      background-image:url('images/foto3.jpg');
      width:22vw;
      height:30vh;
      top:8%;
      right:4%;
      transform:rotate(-4deg);
      animation-delay:1.8s;
    }

    .photo4{
      background-image:url('images/foto4.jpg');
      width:24vw;
      height:32vh;
      top:40%;
      left:6%;
      transform:rotate(5deg);
      animation-delay:2.6s;
    }

    .photo5{
      background-image:url('images/foto5.jpg');
      width:22vw;
      height:30vh;
      top:44%;
      left:38%;
      transform:rotate(-3deg);
      animation-delay:3.4s;
    }

    .photo6{
      background-image:url('images/foto6.jpg');
      width:22vw;
      height:30vh;
      top:42%;
      right:6%;
      transform:rotate(4deg);
      animation-delay:4.2s;
    }

    @keyframes photoAppear{
      from{
        opacity:0;
        transform:scale(.9) translateY(30px);
      }

      to{
        opacity:1;
      }
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.18);
      z-index:-2;
    }

    .wrapper{
      width:100%;
    }

    .panel{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }

    .glass{
      width:100%;
      max-width:1100px;
      background:rgba(0,0,0,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:30px;
      padding:50px;
      box-shadow:none;
    }

    .hero{
      text-align:center;
      animation:fadeIn 2s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-family:"Georgia", serif;
      font-size:78px;
      font-weight:400;
      letter-spacing:2px;
      margin-bottom:20px;
      line-height:1.2;
      text-shadow:0 5px 25px rgba(0,0,0,.35);
      font-style:italic;
    }

    .date{
      font-size:24px;
      letter-spacing:3px;
      margin-bottom:20px;
    }

    .countdown{
      margin:25px auto 35px;
      display:inline-block;
      padding:14px 26px;
      border-radius:999px;
      background:rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.14);
      font-size:18px;
      letter-spacing:1px;
    }

    .hero-text{
      max-width:700px;
      margin:auto;
      line-height:1.8;
      font-size:19px;
      opacity:.95;
    }

    .hero-buttons{
      display:flex;
      gap:18px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:50px;
    }

    .hero-btn{
      display:inline-block;
      padding:16px 32px;
      border-radius:999px;
      background:white;
      color:#222;
      text-decoration:none;
      font-weight:bold;
      transition:.3s;
    }

    .hero-btn:hover{
      transform:translateY(-2px);
    }

    .secondary-btn{
      background:rgba(0,0,0,.20);
      color:white;
      border:1px solid rgba(255,255,255,.18);
    }

    .secondary-btn:hover{
      background:rgba(255,255,255,.12);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
    }

    .mini-card{
      background:rgba(0,0,0,.12);
      border-radius:24px;
      padding:30px;
      border:1px solid rgba(255,255,255,.10);
    }

    h2{
      font-size:38px;
      font-weight:300;
      margin-bottom:30px;
      text-align:center;
    }

    h3{
      margin-bottom:15px;
      font-size:24px;
      font-weight:normal;
    }

    p{
      line-height:1.8;
    }

    iframe{
      width:100%;
      height:250px;
      border:none;
      border-radius:20px;
      margin-top:20px;
    }

    form{
      max-width:700px;
      margin:auto;
    }

    label{
      display:block;
      margin-top:20px;
      margin-bottom:8px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.92);
      color:#333;
      font-size:15px;
      outline:none;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    button{
      width:100%;
      margin-top:30px;
      padding:16px;
      border:none;
      border-radius:999px;
      background:white;
      color:#222;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:translateY(-2px);
      background:#f2f2f2;
    }

    .hidden{
      display:none;
    }

    .footer{
      text-align:center;
      padding:40px;
      opacity:.8;
      font-size:14px;
    }

    @media(max-width:900px){

      .grid{
        grid-template-columns:1fr;
      }

      h1{
        font-size:48px;
        line-height:1.25;
        letter-spacing:1px;
      }

      .glass{
        padding:30px;
      }

      .photo1{
        width:42vw;
        height:16vh;
        top:3%;
        left:4%;
        right:auto;
        transform:rotate(-4deg);
      }

      .photo2{
        width:42vw;
        height:16vh;
        top:5%;
        left:auto;
        right:4%;
        transform:rotate(4deg);
      }

      .photo3{
        width:42vw;
        height:16vh;
        top:24%;
        left:4%;
        right:auto;
        transform:rotate(-3deg);
      }

      .photo4{
        width:42vw;
        height:16vh;
        top:26%;
        left:auto;
        right:4%;
        transform:rotate(3deg);
      }

      .photo5{
        width:42vw;
        height:16vh;
        top:47%;
        left:4%;
        right:auto;
        transform:rotate(-3deg);
      }

      .photo6{
        width:42vw;
        height:16vh;
        top:49%;
        left:auto;
        right:4%;
        transform:rotate(3deg);
      }

      .hero-buttons{
        flex-direction:column;
        align-items:center;
      }
    }

  </style>
</head>

<body>

  <div class="collage">
    <div class="collage-photo photo1"></div>
    <div class="collage-photo photo2"></div>
    <div class="collage-photo photo3"></div>
    <div class="collage-photo photo4"></div>
    <div class="collage-photo photo5"></div>
    <div class="collage-photo photo6"></div>
  </div>

  <div class="overlay"></div>

  <div class="wrapper">

    <section class="panel">
      <div class="glass hero">

        <h1>
          Marco
          <br>
          &
          <br>
          Martina
        </h1>

        <div class="date">
          13 Settembre 2026
        </div>

        <div class="countdown" id="countdown">
          Calcolo del conto alla rovescia...
        </div>

        <p class="hero-text">
          Con immensa gioia vi invitiamo a condividere con noi
          il giorno più bello della nostra vita.
        </p>

        <div class="hero-buttons">

          <a href="#rsvp" class="hero-btn">
            ❤️ Conferma la tua presenza
          </a>

          <a href="#luoghi" class="hero-btn secondary-btn">
            📍 Scopri i luoghi della giornata
          </a>

        </div>

      </div>
    </section>
